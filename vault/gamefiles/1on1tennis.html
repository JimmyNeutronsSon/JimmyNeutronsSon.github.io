<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>1 on 1 Tennis</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          system-ui,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }

      .toolbar {
        display: flex;
        gap: 0.5rem;
        padding: 0.5rem;
        background: #111;
        color: #fff;
        align-items: center;
      }

      button {
        background: #0b84ff;
        color: #fff;
        border: 0;
        padding: 0.5rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
      }

      button:active {
        transform: translateY(1px);
      }

      .frame-wrapper {
        height: 100%;
        background: #000;
        display: flex;
      }

      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="frame-wrapper" id="frameWrapper">
      <iframe
        id="gameFrame"
        src="1 on 1 Tennis.html"
        allowfullscreen
        allow="fullscreen"
      ></iframe>
    </div>
  </body>
</html>
