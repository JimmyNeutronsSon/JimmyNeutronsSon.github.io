    <style>
      .hero {
        flex: 1;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.95);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes fadeOutDown {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }

        to {
          opacity: 0;
          transform: translateY(20px) scale(0.95);
        }
      }

      .update-popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: rgba(11, 30, 61, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .update-popup.hiding {
        animation: fadeOutDown 0.4s cubic-bezier(0.7, 0, 0.3, 1) forwards;
      }

      .update-card {
        background: linear-gradient(
          180deg,
          rgba(10, 45, 110, 0.6),
          rgba(22, 58, 107, 0.7)
        );
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(108, 180, 240, 0.25);
        border-radius: 20px;
        padding: 2.5rem 3rem;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(10, 45, 110, 0.4);
        position: relative;
      }

      .update-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 20px;
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(108, 180, 240, 0.4),
          transparent 60%,
          rgba(58, 143, 224, 0.2)
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .update-icon {
        width: 64px;
        height: 64px;
        background: linear-gradient(180deg, #1e6cc7 0%, #0a2d6e 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 28px;
        box-shadow: 0 10px 30px rgba(30, 108, 199, 0.4);
      }

      .update-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: #f7faff;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }

      .update-desc {
        color: #d6e5f5;
        font-size: 1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .update-desc strong {
        color: #f7faff;
      }

      .update-btn {
        background: linear-gradient(180deg, #3a8fe0 0%, #1e6cc7 100%);
        border: none;
        color: #f7faff;
        padding: 0.875rem 2.5rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      .btn-music-flash {
        background: rgba(255, 255, 255, 0.05) !important;
        backdrop-filter: blur(10px) !important;
        -webkit-backdrop-filter: blur(10px) !important;
        color: white !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        font-weight: 800 !important;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        transition: all 0.3s ease-in-out !important;
      }

      .btn-music-flash:hover {
        background: rgba(255, 255, 255, 0.1) !important;
        border-color: rgba(255, 255, 255, 0.4) !important;
      }
    </style>
  </head>

    <!-- Socket.io client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
      (function () {
        const CURRENT_VERSION = "00b23f1";
        const lastSeen = localStorage.getItem("updateVersion");

        if (lastSeen === CURRENT_VERSION) return;

        const popup = document.createElement("div");
        popup.className = "update-popup";
        popup.innerHTML = `
        <div class="update-card">
          <h2 class="update-title">Site Updated!</h2>
          <p class="update-desc">
            Fixed the <strong>online counter</strong> and <strong>voice chat audio</strong> issues.<br>
            Voice chat now works properly with better connectivity!
          </p>
          <button class="update-btn" id="update-close">Got it!</button>
        </div>
      `;

        document.body.appendChild(popup);

        function dismiss() {
          popup.classList.add("hiding");
          setTimeout(() => popup.remove(), 400);
          localStorage.setItem("updateVersion", CURRENT_VERSION);
        }

        document
          .getElementById("update-close")
          .addEventListener("click", dismiss);
        popup.addEventListener("click", function (e) {
          if (e.target === popup) dismiss();
        });
      })();
    </script>
    <script>
      (function () {
        const counter = document.getElementById("online-counter");

        // On local static dev servers (e.g. live-server, vite, etc.) the Fastify
        // backend isn't running, so skip the socket entirely and show a static label.
        const isLocalDev =
          (window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1") &&
          window.location.port !== "8080"; // change if your Fastify port differs

        if (isLocalDev) {
          counter.textContent = "Currently Online: 1";
          return;
        }

        const socket = io(window.location.origin, { path: "/socket.io/" });

        socket.on("online-count", function (count) {
          counter.textContent = "Currently Online: " + count;
        });

        socket.on("connect", function () {
          socket.emit("lobby:ping");
        });

        socket.on("disconnect", function () {
          counter.textContent = "Currently Online: —";
        });
      })();
    </script>

    <script src="main.js"></script>
