  <!-- Persistent Music Player (injected by music.js) -->

  <script type="module" src="3d-cloud.js"></script>
  <script>
    (function () {
      const counter = document.getElementById("online-counter");
      const isLocalhost =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";

      if (isLocalhost) {
        counter.textContent = "Currently Online: 1";
      } else {
        const ns = "welkin-online-" + window.location.hostname;

        function updateCount() {
          fetch(`https://api.countapi.xyz/get/${ns}/count`)
            .then((res) => res.json())
            .then((data) => {
              counter.textContent = "Currently Online: " + (data.value || 1);
            })
            .catch((e) => {
              console.log("CountAPI error:", e);
              fetch(
                `https://api.countapi.xyz/create/${ns}/count?enable_reset=0&update_upperbound=1000`,
              )
                .then((res) => res.json())
                .then((data) => {
                  counter.textContent =
                    "Currently Online: " + (data.value || 1);
                })
                .catch(() => {
                  counter.textContent = "Currently Online: 1";
                });
            });
        }

        fetch(`https://api.countapi.xyz/hit/${ns}/count`).catch(() => { });
        setTimeout(updateCount, 1000);
        setInterval(updateCount, 15000);
      }
    })();
  </script>
