    @keyframes fadeInUp {

    /* ───────────────────────────────────────── */
    /* SHADER BACKGROUND                         */
    /* ───────────────────────────────────────── */

    #shader-bg {
      position: fixed;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(55, 120, 255, 0.18), transparent 45%),
        radial-gradient(circle at 20% 30%, rgba(0, 153, 255, 0.12), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(120, 200, 255, 0.1), transparent 35%),
        linear-gradient(180deg, #08152d 0%, #0b1f4d 40%, #102d73 100%);
    }

    #shader-bg::before {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle, rgba(130, 200, 255, 0.07) 0%, transparent 60%),
        radial-gradient(circle, rgba(40, 130, 255, 0.05) 0%, transparent 65%);
      filter: blur(80px);
      animation: shaderFloat 18s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }

    #shader-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.25;
      animation: grainShift 8s steps(10) infinite;
    }

    @keyframes shaderFloat {
      0% {
        transform: translate3d(-2%, -1%, 0) scale(1);
      }

      50% {
        transform: translate3d(2%, 2%, 0) scale(1.08);
      }

      100% {
        transform: translate3d(-1%, 1%, 0) scale(1.12);
      }
    }

    @keyframes grainShift {
      0% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(-2%, 1%);
      }

      50% {
        transform: translate(2%, -1%);
      }

      75% {
        transform: translate(1%, 2%);
      }

      100% {
        transform: translate(0, 0);
      }
    }

    /* Clouds blend into shader */
    .hero-bg canvas {
      opacity: 0.72;
      mix-blend-mode: screen;
      filter:
        blur(0.2px) saturate(1.25) brightness(1.05);
    }

    /* Stronger glass effect */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center,

<script>
  const shaderBg = document.getElementById("shader-bg");

  let mouseX = 50;
  let mouseY = 50;

  document.addEventListener("mousemove", (e) => {
    mouseX = (e.clientX / window.innerWidth) * 100;
    mouseY = (e.clientY / window.innerHeight) * 100;

    shaderBg.style.background = `
      radial-gradient(circle at ${mouseX}% ${mouseY}%, rgba(110,190,255,0.24), transparent 18%),
      radial-gradient(circle at ${100 - mouseX}% ${100 - mouseY}%, rgba(80,130,255,0.12), transparent 25%),
      radial-gradient(circle at 50% 50%, rgba(55,120,255,0.18), transparent 45%),
      radial-gradient(circle at 20% 30%, rgba(0,153,255,0.12), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(120,200,255,0.1), transparent 35%),
      linear-gradient(180deg, #08152d 0%, #0b1f4d 40%, #102d73 100%)
    `;
  });

  // Liquid hover effect on buttons
  document.querySelectorAll('.btn').forEach((btn) => {
    btn.addEventListener('mousemove', (e) => {
      const rect = btn.getBoundingClientRect();

      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      const moveX = (x / rect.width - 0.5) * 40;
      const moveY = (y / rect.height - 0.5) * 40;

      btn.style.setProperty('--mx', `${moveX}px`);
      btn.style.setProperty('--my', `${moveY}px`);
    });

    btn.addEventListener('mouseleave', () => {
      btn.style.setProperty('--mx', `0px`);
      btn.style.setProperty('--my', `0px`);
    });
  });
</script>

    (function () {
      const CURRENT_VERSION = "00b23f1";
      const lastSeen = localStorage.getItem("updateVersion");

      const popup = document.createElement("div");
      popup.className = "update-popup";

            As you guys know the previous link got blocked<br>

            Unfortunately the <strong>Proxy is broken</strong>
          <button class="update-btn" id="update-close">Got it!</button>
        </div>
      `;

      document.body.appendChild(popup);

      function dismiss() {
        popup.classList.add("hiding");
        setTimeout(() => popup.remove(), 400);
        localStorage.setItem("updateVersion", CURRENT_VERSION);
      }

      document
        .getElementById("update-close")
        .addEventListener("click", dismiss);
      popup.addEventListener("click", function (e) {
        if (e.target === popup) dismiss();
      });
    })();
  </script>
